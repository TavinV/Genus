# CI/CD da Genus.
#
#   pull_request para main  → testes (só das partes que mudaram)
#   push na main            → testes e, se passarem, imagem no GHCR e deploy no Easypanel só dos serviços que mudaram
#   workflow_dispatch       → testes e deploy; com deploy_all, dispara todos os serviços
#
# Cada serviço tem um gatilho de deploy no Easypanel, guardado como segredo do repositório:
#   EASYPANEL_DEPLOY_API · EASYPANEL_DEPLOY_COLLECTOR_API · EASYPANEL_DEPLOY_FACE_ENGINE
#   EASYPANEL_DEPLOY_JOBS · EASYPANEL_DEPLOY_PORTAL · EASYPANEL_DEPLOY_REP_CORE
# O nome do filtro em `changes` (API, COLLECTOR_API...) é o sufixo do segredo: mantenha os dois iguais.
# As imagens vão para ghcr.io/<dono>/genus-<serviço> (api, collector-api, face-engine, jobs, portal,
# rep-core); no Easypanel cada serviço usa a origem "Imagem Docker" apontando para a tag `latest`.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: Fazer deploy de todos os serviços, mesmo sem mudança
        type: boolean
        default: false

concurrency:
  group: ci-cd-${{ github.ref }}
  # Na main um deploy nunca é cancelado no meio; em PR, o push novo substitui o anterior.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.ci.outputs.node }}
      face-engine: ${{ steps.ci.outputs.face-engine }}
      services: ${{ steps.deploy.outputs.changes }}
    steps:
      - uses: actions/checkout@v5

      # O que precisa de teste.
      - id: ci
        uses: dorny/paths-filter@v3
        with:
          filters: |
            node:
              - 'apps/**'
              - 'packages/**'
              - 'db/**'
              - 'tests/**'
              - 'docker/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.nvmrc'
              - '.github/workflows/ci-cd.yml'
            face-engine:
              - 'services/face-engine/**'
              - '.github/workflows/ci-cd.yml'

      # O que vai para o Easypanel: cada filtro lista o que entra na imagem daquele serviço.
      # Os serviços Node do monorepo dependem de @genus/shared, @genus/queue e @genus/db-arp.
      - id: deploy
        uses: dorny/paths-filter@v3
        with:
          filters: |
            node_base: &node_base
              - 'packages/shared/**'
              - 'packages/queue/**'
              - 'db/arp/**'
              - 'docker/node.Dockerfile'
              - 'docker/node.Dockerfile.dockerignore'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
            API:
              - *node_base
              - 'apps/api/**'
            COLLECTOR_API:
              - *node_base
              - 'apps/collector-api/**'
            JOBS:
              - *node_base
              - 'apps/jobs/**'
            REP_CORE:
              - *node_base
              - 'apps/rep-core/**'
            PORTAL:
              - 'apps/portal/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
            FACE_ENGINE:
              - 'services/face-engine/**'

  node:
    name: Node (typecheck, lint, testes)
    needs: changes
    if: needs.changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      # Os testes de banco sobem Postgres com Testcontainers (o runner já tem Docker).
      - run: pnpm -r test

  face-engine:
    name: Face engine (pytest)
    needs: changes
    if: needs.changes.outputs.face-engine == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/face-engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            services/face-engine/requirements.txt
            services/face-engine/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Só o tier puro (padrão do pytest.ini): sem engine no ar e sem modelos ONNX.
      - run: python -m pytest

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: [changes, node, face-engine]
    # Só na main, só se nenhum teste falhou (job pulado conta como ok) e só se algum serviço mudou.
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !contains(needs.*.result, 'failure')
      && needs.changes.result == 'success'
      && (inputs.deploy_all || needs.changes.outputs.services != '[]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: >-
          ${{ fromJSON(inputs.deploy_all
            && '["API","COLLECTOR_API","FACE_ENGINE","JOBS","PORTAL","REP_CORE"]'
            || needs.changes.outputs.services) }}
        exclude:
          - service: node_base
    steps:
      - uses: actions/checkout@v5

      # A imagem é construída aqui, no runner do GitHub, e publicada no GHCR. A VPS só baixa a
      # imagem pronta: buildar lá (1 vCPU, vários serviços ao mesmo tempo) travava a máquina inteira,
      # inclusive os outros sistemas hospedados nela.
      - name: Escolher Dockerfile e argumentos
        id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          name=$(echo "$SERVICE" | tr 'A-Z_' 'a-z-')
          context=.
          # build-args separados por espaço (viram uma linha cada abaixo).
          case "$SERVICE" in
            API)           file=docker/node.Dockerfile; args='PKG=@genus/api DIR=apps/api' ;;
            COLLECTOR_API) file=docker/node.Dockerfile; args='PKG=@genus/collector-api DIR=apps/collector-api' ;;
            JOBS)          file=docker/node.Dockerfile; args='PKG=@genus/jobs DIR=apps/jobs' ;;
            REP_CORE)      file=docker/node.Dockerfile; args='PKG=@genus/rep-core DIR=apps/rep-core' ;;
            # Os rewrites do Next são fixados no build: os endereços internos do Easypanel entram aqui.
            PORTAL)        file=apps/portal/Dockerfile
                           args='NEXT_PUBLIC_USE_MOCKS=false API_URL=http://genus_api:3002 COLLECTOR_URL=http://genus_collector-api:3001' ;;
            FACE_ENGINE)   context=services/face-engine; file=services/face-engine/Dockerfile; args='' ;;
            *) echo "::error::Serviço sem imagem configurada: $SERVICE"; exit 1 ;;
          esac
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          {
            echo "name=$name"
            echo "repo=ghcr.io/$owner/genus-$name"
            echo "context=$context"
            echo "file=$file"
            echo "args<<EOF"
            for a in $args; do echo "$a"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar ${{ steps.image.outputs.repo }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.image.outputs.context }}
          file: ${{ steps.image.outputs.file }}
          build-args: ${{ steps.image.outputs.args }}
          push: true
          # `latest` é o que o Easypanel baixa; o SHA fica para voltar a uma versão anterior.
          tags: |
            ${{ steps.image.outputs.repo }}:latest
            ${{ steps.image.outputs.repo }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ steps.image.outputs.name }}
          cache-to: type=gha,scope=${{ steps.image.outputs.name }},mode=max
          provenance: false

      - name: Disparar o deploy no Easypanel
        env:
          DEPLOY_HOOK: ${{ secrets[format('EASYPANEL_DEPLOY_{0}', matrix.service)] }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Segredo EASYPANEL_DEPLOY_${{ matrix.service }} não configurado no repositório."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --retry 3 --retry-all-errors --retry-delay 5 \
            -X POST "$DEPLOY_HOOK" -o /dev/null -w "HTTP %{http_code}\n"
